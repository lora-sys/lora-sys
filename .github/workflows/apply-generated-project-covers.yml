name: Apply generated project covers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-generated-project-covers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-generated-project-covers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install image dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Assemble and verify four generated covers
        run: python3 scripts/apply_generated_project_covers.py
      - name: Commit final cover sources and clean staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/readme/project-covers scripts/build_approved_profile.py
          git rm -f scripts/apply_generated_project_covers.py .github/workflows/apply-generated-project-covers.yml
          git commit -m 'feat(profile): use custom illustrated covers for secondary projects'
          git push origin HEAD:main
