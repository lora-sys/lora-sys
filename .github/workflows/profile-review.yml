name: Review profile appearance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture public pages and local source assets
        run: |
          mkdir -p qa/input qa/references
          cp assets/readme/hero-v1.webp qa/input/banner.webp
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out = Path('qa')
          report = []
          sources = {
              'glassbox': 'https://raw.githubusercontent.com/lora-sys/Glassbox-Agent-Harness/main/assets/readme/glassbox-hero.png',
              'zhihu': 'https://raw.githubusercontent.com/lora-sys/zhihu-threads/main/assets/readme/lora-v3-project-zhihu-threads-zh.webp',
              'vllm': 'https://raw.githubusercontent.com/lora-sys/nano-vllm-interactive-guide/main/assets/readme/hero-v1.webp',
              'vision': 'https://raw.githubusercontent.com/lora-sys/free-vision-skill/main/assets/readme/hero-v1.webp',
              'skills': 'https://raw.githubusercontent.com/lora-sys/skills/main/assets/readme/hero.png',
              'arena': 'https://raw.githubusercontent.com/lora-sys/AgentArena/main/docs/qa/visual-baselines/v052-home-desktop-20260725.png'
          }
          for name, url in sources.items():
              try:
                  with urllib.request.urlopen(url, timeout=25) as r:
                      data = r.read(12_000_000)
                  (out / 'input' / (name + Path(url).suffix)).write_bytes(data)
              except Exception as e:
                  report.append({'asset': name, 'error': str(e)})
          targets = [
              ('profile', 'https://github.com/lora-sys'),
              ('sharann', 'https://github.com/Sharann-del/Sharann-del'),
              ('dimflix', 'https://github.com/DIMFLIX/DIMFLIX'),
              ('hirad', 'https://github.com/HiradEmami/HiradEmami')
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width':1440,'height':1000}, device_scale_factor=1)
              for name, url in targets:
                  try:
                      response = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(3500)
                      (out / 'references' / (name + '.html')).write_text(page.content(), encoding='utf-8')
                      article = page.locator('article.markdown-body').first
                      if article.count():
                          article.screenshot(path=str(out / 'references' / (name + '.png')), animations='disabled', timeout=20000)
                      else:
                          page.screenshot(path=str(out / 'references' / (name + '.png')), full_page=True)
                      report.append({'page':name,'status':response.status if response else None,'title':page.title(),'article':article.count()})
                  except Exception as e:
                      report.append({'page':name,'error':str(e)})
              browser.close()
          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-visual-review
          path: qa/
          retention-days: 7
