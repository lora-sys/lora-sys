name: Review profile appearance

on:
  workflow_run:
    workflows: [Build profile visuals]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-review
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify the actual public profile
        run: python scripts/review_profile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-visual-review
          path: qa/
          retention-days: 7
