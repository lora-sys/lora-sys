name: Review profile appearance

on:
  push:
    branches: [main]
    paths:
      - scripts/check_live_profile.py
      - .github/workflows/check-profile.yml
  workflow_run:
    workflows: [Build profile visuals]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-review
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install browser and Chinese fonts
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify the actual public profile
        run: python scripts/check_live_profile.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-visual-review
          path: qa-live/
          retention-days: 7
