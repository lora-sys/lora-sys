name: Build profile visuals

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build_approved_profile.py
      - scripts/prepare_approved_layout.py
      - scripts/normalize_profile_svg.py
      - assets/profile/**
      - .github/workflows/snake.yml
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'lora-sys/lora-sys'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read last successful public assets
        run: |
          git fetch --depth=1 origin output
          git worktree add --detach previous FETCH_HEAD
      - name: Install render dependencies
        run: |
          python3 -m pip install Pillow==11.3.0 beautifulsoup4==4.13.4 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23B67D17&color_dots=%23EEE8DD,%23E9D8B8,%23DAB477,%23BA873B,%238B5E34
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E0A62F&color_dots=%23242529,%234D4030,%23755A31,%23AB7A32,%23DDB365
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build approved profile and verify real statistics
        run: |
          python3 scripts/build_approved_profile.py
          python3 scripts/normalize_profile_svg.py dist/v5
      - name: Validate published files and motion
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path('dist/v5')
          source=json.loads((root/'sources.json').read_text())
          assert len(source['statistics'])==6
          for key,item in source['statistics'].items():
              assert item['status'] in ('fresh','retained_previous'), key
              assert item.get('fetched_at') and item.get('sha256'), key
          for path in root.rglob('*.svg'):
              data=path.read_text()
              ET.fromstring(data)
              assert '<script' not in data and '<foreignObject' not in data, path
              assert '@font-face' not in data and 'font/woff' not in data, path
          motion={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':980,'height':700})
              for name in ('typing-light-desktop','snake-light-desktop','typing-dark-mobile-static','snake-dark-mobile-static'):
                  data=base64.b64encode((root/(name+'.svg')).read_bytes()).decode()
                  page.set_content('<img src="data:image/svg+xml;base64,'+data+'">')
                  page.wait_for_timeout(150)
                  first=page.screenshot()
                  page.wait_for_timeout(1500)
                  second=page.screenshot()
                  different=hashlib.sha256(first).digest()!=hashlib.sha256(second).digest()
                  motion[name]={'frames_differ':different}
                  assert different==('-static' not in name), name
              browser.close()
          Path('qa/motion.json').write_text(json.dumps(motion,indent=2))
          for name in ('snake-light.svg','snake-dark.svg'):
              path=Path('dist')/name
              svg=path.read_text().replace('</svg>','<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>')
              path.write_text(svg)
              path.with_name(path.stem+'-static.svg').write_text(svg.replace('</svg>','<style>*{animation:none!important}</style></svg>'))
          print('Verified',len(list(root.rglob('*.svg'))),'SVGs, six real data sources and animated/static frames')
          PY
      - name: Publish approved assets without rewriting history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -R dist/v5 previous/
          cp dist/snake-*.svg previous/
          touch previous/.nojekyll
          cd previous
          git add -- v5 '*.svg' .nojekyll
          if git diff --cached --quiet; then
            echo 'Assets unchanged'
          else
            git commit -m 'chore(profile): refresh approved assets and verified data'
            git push origin HEAD:output
          fi
      - name: Upload generated README, source and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-profile-build
          path: |
            dist/
            qa/
            scripts/build_approved_profile.py
            scripts/prepare_approved_layout.py
            scripts/normalize_profile_svg.py
            assets/profile/approved-layout.html
            assets/readme/hero-v1.webp
          retention-days: 7