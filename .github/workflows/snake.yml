name: Build profile visuals

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/build_profile_v4.py
      - .github/workflows/snake.yml
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'lora-sys/lora-sys'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build profile gallery and typing assets
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/build_profile_v4.py --output dist
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23B67D17&color_dots=%23EEE8DD,%23E9D8B8,%23DAB477,%23BA873B,%238B5E34
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E0A62F&color_dots=%23242529,%234D4030,%23755A31,%23AB7A32,%23DDB365
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate assets and static fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('snake-light.svg', 'snake-dark.svg'):
              path=Path('dist')/name
              svg=path.read_text()
              svg=svg.replace('</svg>', '<style>@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></svg>')
              path.write_text(svg)
              still=svg.replace('</svg>', '<style>*{animation:none!important;transition:none!important}</style></svg>')
              path.with_name(path.stem+'-static.svg').write_text(still)
          assets=list(Path('dist').rglob('*.svg'))
          assert len(assets)==64, len(assets)
          for path in assets:
              data=path.read_text()
              ET.fromstring(data)
              assert '<script' not in data and '<foreignObject' not in data, path
          print('64 SVGs validated; original banner unchanged')
          PY
      - name: Publish assets without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 origin output
          git worktree add --detach publish FETCH_HEAD
          cp -R dist/. publish/
          touch publish/.nojekyll
          cd publish
          git add -- v4 '*.svg' .nojekyll
          if git diff --cached --quiet; then
            echo 'Profile assets unchanged'
            exit 0
          fi
          git commit -m 'chore: refresh profile gallery and animations'
          git push origin HEAD:output
