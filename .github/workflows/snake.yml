name: Build profile visuals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'lora-sys/lora-sys'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Read last successful public assets
        run: |
          git fetch --depth=1 origin output
          git worktree add --detach previous FETCH_HEAD
      - name: Install render dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%23B67D17&color_dots=%23EEE8DD,%23E9D8B8,%23DAB477,%23BA873B,%238B5E34
            dist/snake-dark.svg?palette=github-dark&color_snake=%23E0A62F&color_dots=%23242529,%234D4030,%23755A31,%23AB7A32,%23DDB365
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build approved profile and verify real statistics
        run: |
          python3 scripts/build_approved_profile.py
          python3 scripts/normalize_profile_svg.py dist/v5
      - name: Validate published files and motion
        run: python3 scripts/validate_profile.py
      - name: Publish approved assets without rewriting history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rsync -a --delete dist/v5/ previous/v5/
          cp dist/snake-*.svg previous/
          touch previous/.nojekyll
          cd previous
          git add -- v5 '*.svg' .nojekyll
          if git diff --cached --quiet; then
            echo 'Assets unchanged'
          else
            git commit -m 'chore(profile): refresh approved assets and verified data'
            git push origin HEAD:output
          fi
      - name: Upload generated README, source and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-profile-build
          path: |
            dist/
            qa/
            scripts/build_approved_profile.py
            scripts/prepare_approved_layout.py
            scripts/normalize_profile_svg.py
            scripts/validate_profile.py
            requirements.txt
            assets/profile/approved-layout.html
            assets/readme/hero-v1.webp
          retention-days: 7