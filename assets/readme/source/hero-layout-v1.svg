<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lora Sys, AI Agent Engineer</title>
  <desc id="desc">Warm editorial profile hero with lora and Mochi at a creator desk, surrounded by agent systems, inference guides, and developer tools.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#8B5E34" opacity="0.08"/>
      <path d="M8 13h5" stroke="#1A1A1A" stroke-width="0.5" opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#F7F4EE"/>
    <rect width="1200" height="420" fill="url(#paper)"/>
    <path d="M0 8H1200" stroke="#E0A62F" stroke-width="8"/>
    <circle cx="1050" cy="-40" r="220" fill="#EDE6D6"/>
    <circle cx="1050" cy="-40" r="172" fill="none" stroke="#8B5E34" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.38"/>

    <g id="identity" transform="translate(62 64)">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.5" fill="#8B5E34">
        <text x="0" y="0">CREATOR PROFILE / 01</text>
      </g>
      <text x="0" y="86" fill="#1A1A1A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="74" font-weight="850" letter-spacing="-2">LORA SYS</text>
      <text x="3" y="126" fill="#E0A62F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800" letter-spacing="5">AI AGENT ENGINEER</text>
      <path d="M0 154H520" stroke="#1A1A1A" stroke-width="1.5" opacity="0.18"/>
      <text x="0" y="190" fill="#4A4A4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="520">Building inspectable agent systems, inference</text>
      <text x="0" y="220" fill="#4A4A4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="520">guides, and developer tools.</text>

      <g transform="translate(0 258)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">
        <rect width="154" height="42" rx="21" fill="#1A1A1A"/>
        <circle cx="22" cy="21" r="6" fill="#E0A62F"/>
        <text x="39" y="27" fill="#F7F4EE">AGENT SYSTEMS</text>
        <rect x="168" width="164" height="42" rx="21" fill="#EDE6D6" stroke="#8B5E34" stroke-opacity="0.35"/>
        <circle cx="190" cy="21" r="6" fill="#E0A62F"/>
        <text x="207" y="27" fill="#1A1A1A">INFERENCE GUIDES</text>
        <rect x="346" width="166" height="42" rx="21" fill="#EDE6D6" stroke="#8B5E34" stroke-opacity="0.35"/>
        <circle cx="368" cy="21" r="6" fill="#E0A62F"/>
        <text x="385" y="27" fill="#1A1A1A">DEVELOPER TOOLS</text>
      </g>
    </g>

    <g id="project-orbit" transform="translate(610 62)" fill="none" stroke="#8B5E34" opacity="0.38">
      <path d="M34 12C146 42 186 126 158 222" stroke-width="1.5" stroke-dasharray="5 8"/>
      <circle cx="34" cy="12" r="7" fill="#E0A62F" stroke="none"/>
      <circle cx="159" cy="221" r="7" fill="#1A1A1A" stroke="none"/>
    </g>
    <image id="lora-mochi" x="702" y="22" width="475" height="398" xlink:href="hero-subject-v1.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
